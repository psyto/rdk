[package]
name         = "princeps-faucet"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }

[[bin]]
name = "princeps-faucet"
path = "src/main.rs"

[dependencies]
axum               = "0.7"
clap               = { version = "4.6", features = ["derive"] }
eyre               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
metrics            = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rusqlite           = { version = "0.32", features = ["bundled"] }
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
async-trait        = { workspace = true }
alloy-primitives   = { workspace = true, default-features = false, features = ["std"] }
alloy-consensus    = { workspace = true, default-features = false, features = ["std", "k256"] }
alloy-signer       = { workspace = true }
alloy-signer-local = { workspace = true, features = ["keystore"] }
alloy-network      = { workspace = true }
alloy-rlp          = { workspace = true }
hex                = "0.4"

[dev-dependencies]
tempfile       = "3"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
